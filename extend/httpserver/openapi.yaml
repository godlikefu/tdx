openapi: 3.0.3
info:
  title: tdx HTTP API
  version: 1.0.0
  description: '通达信协议 HTTP 服务(标准行情 + mac 方言 + 扩展行情)。


    - 统一响应 `{code, msg, data}`, code=0 成功

    - 价格单位=厘(元×1000), 成交量=手, 资金流单位=元

    - /mac/* 需启动配置 WithMacHosts(或 cmd/tdx-api 默认开启)

    - 本文件由路由注册机械提取生成, 与代码同步校验'
servers:
- url: http://127.0.0.1:8080
tags:
- name: 健康检查
- name: 代码与数量
- name: 行情与财务
- name: 分时与成交
- name: K线
- name: 指数K线
- name: 板块与报表
- name: 扩展行情
- name: mac 方言
paths:
  /:
    get:
      tags:
      - 健康检查
      summary: 健康检查
      description: 健康检查
      parameters: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        status:
                          type: string
        '400':
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '502':
          description: 上游通达信服务器错误/超时
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
