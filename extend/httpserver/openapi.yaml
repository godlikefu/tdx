components:
  parameters:
    code:
      name: code
      in: query
      required: true
      description: 证券代码, 带前缀(sh601872/sz000001/bj430047)或 6 位数字
      schema:
        type: string
        example: sh601872
    codes:
      name: codes
      in: query
      required: true
      description: 逗号分隔的多个证券代码(≤80 只)
      schema:
        type: string
        example: sh601872,sz000001
    exchange:
      name: exchange
      in: query
      required: true
      description: 交易所
      schema:
        type: string
        enum:
        - sh
        - sz
        - bj
    start:
      name: start
      in: query
      required: true
      description: 分页起点(0=最新一端)
      schema:
        type: integer
        minimum: 0
    count:
      name: count
      in: query
      required: true
      description: 每页数量
      schema:
        type: integer
        minimum: 1
    date:
      name: date
      in: query
      required: true
      description: 日期 YYYYMMDD
      schema:
        type: string
        example: '20260828'
    type:
      name: type
      in: query
      required: true
      description: 'K线类型: 0=5分钟 1=15分钟 2=30分钟 3=60分钟 4=日K(Day2) 5=周 6=月 7/8=1分钟 9=日 10=季 11=年'
      schema:
        type: integer
        minimum: 0
        maximum: 11
    board:
      name: board
      in: query
      required: true
      description: 板块显示代码(880216/399372/899050/000686 等, 自动转协议代码)
      schema:
        type: string
        example: '880216'
    market:
      name: market
      in: query
      required: true
      description: 市场代码(扩展行情, 见 /ex/markets)
      schema:
        type: integer
    category:
      name: category
      in: query
      required: true
      description: 扩展行情 K线周期
      schema:
        type: integer
    start32:
      name: start
      in: query
      required: true
      description: 起始偏移
      schema:
        type: integer
        minimum: 0
        format: int32
    date32:
      name: date
      in: query
      required: true
      description: 日期 YYYYMMDD
      schema:
        type: integer
        example: 20260828
    date2:
      name: date2
      in: query
      required: true
      description: 结束日期 YYYYMMDD
      schema:
        type: integer
        example: 20260828
    filename:
      name: filename
      in: query
      required: true
      description: F10 文件名(来自 /company/category)
      schema:
        type: string
    length:
      name: length
      in: query
      required: true
      description: 读取长度(字节)
      schema:
        type: integer
        minimum: 1
  schemas:
    MacLevel:
      type: object
      properties:
        Price:
          type: integer
          description: 价格(厘, 元×1000)
        Vol:
          type: integer
          description: 量(手)
    Kline:
      type: object
      properties:
        Last:
          type: integer
          description: 昨收(厘)
        Open:
          type: integer
          description: 开盘(厘)
        High:
          type: integer
          description: 最高(厘)
        Low:
          type: integer
          description: 最低(厘)
        Close:
          type: integer
          description: 收盘/最新(厘)
        Order:
          type: integer
          description: 成交单数
        Volume:
          type: integer
          description: 成交量(手)
        Amount:
          type: integer
          description: 成交额(厘)
        Time:
          type: string
          format: date-time
        UpCount:
          type: integer
          description: 上涨家数(指数)
        DownCount:
          type: integer
          description: 下跌家数(指数)
    KlineResp:
      type: object
      properties:
        Count:
          type: integer
        List:
          type: array
          items:
            $ref: '#/components/schemas/Kline'
    PriceLevel:
      type: object
      properties:
        Buy:
          type: boolean
        Price:
          type: integer
          description: 委托价(厘)
        Number:
          type: integer
          description: 委托量(手)
    Quote:
      type: object
      properties:
        Exchange:
          type: integer
          description: 0=SZ 1=SH
        Code:
          type: string
        Active1:
          type: integer
          description: 活跃度
        Kline:
          $ref: '#/components/schemas/Kline'
        ServerTime:
          type: string
          description: 服务器时间 HHMMSSmmm
        Intuition:
          type: integer
          description: 现量(手)
        InsideDish:
          type: integer
          description: 内盘(手)
        OuterDisc:
          type: integer
          description: 外盘(手)
        BuyLevel:
          type: array
          items:
            $ref: '#/components/schemas/PriceLevel'
          description: 5档买盘
        SellLevel:
          type: array
          items:
            $ref: '#/components/schemas/PriceLevel'
          description: 5档卖盘
        Rate:
          type: number
    MinuteResp:
      type: object
      properties:
        Count:
          type: integer
        List:
          type: array
          items:
            type: object
            properties:
              Time:
                type: string
                description: HHMM
              Price:
                type: integer
                description: 价格(厘)
              Number:
                type: integer
                description: 量(手)
    MacQuote:
      type: object
      description: 价格=厘(元×1000); 量=手; MainNetAmount/Amount=元
      properties:
        Market:
          type: integer
          description: 0=SZ 1=SH
        Code:
          type: string
        Name:
          type: string
        PreClose:
          type: integer
        Open:
          type: integer
        High:
          type: integer
        Low:
          type: integer
        Price:
          type: integer
          description: 最新价(厘)
        AvgPrice:
          type: integer
          description: 均价(厘)
        BuyPriceLimit:
          type: integer
          description: 涨停价(厘)
        SellPriceLimit:
          type: integer
          description: 跌停价(厘)
        Volume:
          type: integer
          description: 成交量(手)
        VolRatio:
          type: number
          description: 量比
        Amount:
          type: number
          description: 成交额(元)
        InsideVolume:
          type: integer
          description: 内盘(手)
        OutsideVolume:
          type: integer
          description: 外盘(手)
        TotalShares:
          type: number
          description: 总股本(万)
        FloatShares:
          type: number
          description: 流通股(万)
        PE:
          type: number
          description: 市盈率(动)
        LastVolume:
          type: integer
          description: 现量(手)
        Turnover:
          type: number
          description: 换手%
        SpeedPct:
          type: number
          description: 涨速%
        AfterHoursVol:
          type: number
          description: 盘后量(手)
        PeTTM:
          type: number
        PeStatic:
          type: number
        MainNetAmount:
          type: number
          description: 今日主力净流入(元)
        VolSpeedPct:
          type: number
        MainNetRatio:
          type: number
          description: 主力净比%
        EntrustRatio:
          type: number
          description: 委比%
        Bids:
          type: array
          items:
            $ref: '#/components/schemas/MacLevel'
          description: 买1-5档
        Asks:
          type: array
          items:
            $ref: '#/components/schemas/MacLevel'
          description: 卖1-5档
    MacTrade:
      type: object
      properties:
        Time:
          type: string
          format: date-time
          description: 秒级(日期部分由客户端当日补齐)
        Price:
          type: integer
          description: 价格(厘)
        Volume:
          type: integer
          description: 量(手)
        TradeCount:
          type: integer
          description: 撮合笔数
        Status:
          type: integer
          description: 0=买入 1=卖出 2=中性/集合竞价 5=盘后固定价
    MacTradeResp:
      type: object
      properties:
        Count:
          type: integer
        Total:
          type: integer
          description: 当日总笔数
        List:
          type: array
          items:
            $ref: '#/components/schemas/MacTrade'
    MacCapitalFlow:
      type: object
      properties:
        MainIn:
          type: number
          description: 主力流入(元)
        MainOut:
          type: number
          description: 主力流出(元)
        MainNet:
          type: number
          description: 主力净流入(元)
        SmallIn:
          type: number
          description: 散户流入(元)
        SmallOut:
          type: number
          description: 散户流出(元)
        SmallNet:
          type: number
          description: 散户净流入(元)
        FiveDay:
          type: array
          items:
            type: number
          description: 5日明细(口径见 README)
    MacBelongBoard:
      type: object
      properties:
        BoardType:
          type: integer
        Market:
          type: integer
        BoardCode:
          type: string
        BoardName:
          type: string
        Close:
          type: number
        PreClose:
          type: number
    MacSession:
      type: object
      properties:
        Open:
          type: integer
          description: 开市分钟数(570=09:30)
        Close:
          type: integer
          description: 收市分钟数(900=15:00)
    MacServerSession:
      type: object
      properties:
        Today:
          type: string
          format: date-time
        LastTradingDay:
          type: string
          format: date-time
        Sessions1:
          type: array
          items:
            $ref: '#/components/schemas/MacSession'
          description: 交易时段组1(A股 4 槽)
        Sessions2:
          type: array
          items:
            $ref: '#/components/schemas/MacSession'
          description: 交易时段组2
        MarketParam1:
          type: integer
        MarketParam2:
          type: integer
    MacKlineCount:
      type: object
      properties:
        Total:
          type: integer
        Returned:
          type: integer
    Envelope:
      type: object
      properties:
        code:
          type: integer
          description: 0=成功 1=失败
        msg:
          type: string
        data: {}
